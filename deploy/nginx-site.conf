# Modelo do site no Nginx da VPS. O deploy/preparar-vps.sh troca __APP__ e
# __DOMINIO__ e instala em /etc/nginx/sites-available/__APP__.
# O certbot acrescenta a parte do HTTPS (porta 443) ao arquivo instalado.
# Cabeçalhos de segurança são definidos pela aplicação (SecurityHeaders).

server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;

    root /var/www/__APP__/app/public;
    index index.php;
    charset utf-8;

    client_max_body_size 12M;

    access_log /var/log/nginx/__APP__.access.log;
    error_log  /var/log/nginx/__APP__.error.log warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/__APP__.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Nenhum outro .php é executado; arquivos ocultos nunca são entregues.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
